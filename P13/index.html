<!doctype html>
<html>
<head>
  <title>P13: Flexbox and Grid Comparison</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Flexbox or Grid?</h1>
    <p>The same three items are arranged with both layout methods.</p>
  </header>

  <main>
    <section>
      <h2>Flexbox layout</h2>
      <div class="flex-layout">
        <article class="item"><h3>HTML</h3><p>Page structure</p></article>
        <article class="item"><h3>CSS</h3><p>Page styling</p></article>
        <article class="item"><h3>Git</h3><p>Version control</p></article>
      </div>
    </section>

    <section>
      <h2>CSS Grid layout</h2>
      <div class="grid-layout">
        <article class="item"><h3>HTML</h3><p>Page structure</p></article>
        <article class="item"><h3>CSS</h3><p>Page styling</p></article>
        <article class="item"><h3>GitHub</h3><p>Version control</p></article>
      </div>
    </section>
  </main>

  <footer>
    <p>P13 successful</p>
  </footer>
</body>
</html>
